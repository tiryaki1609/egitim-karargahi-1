<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Paneli</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        .glass-login {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
            color: white;
        }
        h2 { font-weight: 300; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; opacity: 0.9; }
        input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            outline: none;
            font-size: 1rem;
        }
        .btn-entry {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-entry:hover { background: rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body oncontextmenu="return false;"> <div class="glass-login">
        <h2>Hoş Geldiniz</h2>
        <div class="input-group">
            <label>Beş ile üçü toplarsak kaç eder? Cevabı yazar mısın?</label>
            <input type="text" id="bot-check" autocomplete="off">
        </div>
        <button class="btn-entry" onclick="verify()">Kontrol Et ve Gir</button>
    </div>

    <script>
        // İsa, burada cevabı matematiksel bir işlemle gizledik (8 yerine 4*2 kontrolü gibi)
        function verify() {
            const val = document.getElementById('bot-check').value;
            const secret = (Math.sqrt(64)); // 8 rakamını gizli tutar
            
            if(parseInt(val) === secret) {
                // Başarılı giriş
                window.location.href = "kimlik.html";
            } else {
                alert("Neredeyse oldu! Tekrar denemeye ne dersin? Başaracağına eminim.");
            }
        }

        // Klavye ile inceleme araçlarını (F12 vb.) engelleme
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0)))) {
                return false;
            }
        }
    </script>
</body>
</html>
